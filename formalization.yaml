version: v0.4
project:
  name: Exact Maxima and Prime Obstructions for Lonely Runners
  description: >-
    For every nonempty tuple of positive integer speeds, every maximizing
    time and the maximum loneliness admit a common denominator equal to
    a sum of two speeds, with repeated indices allowed. This gives an exact
    finite-grid criterion and proves that the reduced denominator divides
    such a sum. The development also proves a general prime-divisor
    capacity theorem and a finite-prime obstruction to six distinct
    positive speeds being free of additive triads, under explicit norm
    and modular covering hypotheses. Rational interval certificates
    establish all nine sporadic loneliness values in Cordella's Table 2,
    and show that the reduced denominator of the value need not suffice
    for a maximizing-time grid. Scaling invariance and conditional
    effective-bound arithmetic are included. The submission does not
    assert the global resolutions of Questions 6.6 and 6.7 or completeness
    of the sporadic list.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11K60, 11J13, 11Y16]
sources:
  - title: Odd denominators in the Lonely Runner spectrum for six speeds
    authors: [Francesco Cordella]
    type: paper
    url: https://arxiv.org/abs/2609.03444v2
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Formalizes the nine exact values in Table 2 and adapts the
      candidate-time principle of Lemma 2.2 to positive speeds using
      only sum denominators, including loneliness one half. The general
      prime-capacity and triad-lifting arguments are stated and proved
      in PROOF.md and the Lean sources. No novelty is claimed for the
      published values or the candidate-time principle. Questions 6.6
      and 6.7 motivate the application; their global resolution is
      outside the submitted scope.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI Codex (GPT-6), directed by JD Jones
      notes: >-
        Assisted with mathematical arguments; wrote Lean proofs and
        documentation; generated rational interval certificates and a
        complete short-form catalogue with Python; compiled and audited
        the resulting proof terms. Generated data and external computations
        are not trusted without Lean proofs.
review:
  status: self-assessed
  notes: >-
    Authoring-agent compilation, source checks and axiom audit; sandboxed
    Comparator and independent NanoDa and con-ron checks are run by the
    verification workflow. No independent human review or Palomar editorial
    review is recorded.
scope:
  completed: The 29 theorems listed in comparator.json and their supporting development.
  excluded: >-
    Global resolutions of Questions 6.6 and 6.7; geometric norm and height
    estimates; completeness of the sporadic list; critical-torus
    classification; unconditional finite-field prime assertions.
