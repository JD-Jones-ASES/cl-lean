version: v0.4
project:
  name: Effective Global Bounds and Critical Families for Lonely Runners
  description: >-
    Proves explicit global bounds motivated by Cordella's Questions 6.6 and
    6.7. For n >= 3, assuming Lonely Runner for n-1 and n-2 nonzero speeds,
    every positive primitive near-tight tuple off the critical rational
    two-planes satisfies norm(v) < (3n/2) K(n)^2, with
    K(n) = n^n [n(n-1)]^(n-2). The exceptional set is finite, and every
    positive primitive tuple with loneliness p/q < 1/n satisfies
    norm(v) < (n K(n)/2) q/(q-np) <= (n K(n)/2) q. Lean constructs the
    containing plane, proves its height bound, and establishes the density
    and denominator estimates. The lower-speed hypotheses are explicit in
    general and discharged through five speeds, making the six-speed
    off-critical and coarse denominator bounds unconditional.
    Also proves the known tight-five classification: every primitive
    zero-free integer quintuple of loneliness 1/6 is a signed permutation
    of (1,2,3,4,5) or (1,3,4,5,9). A geometric norm bound, forty finite
    modular covers, normalization, integer lifting and algebraic profile
    recovery are all kernel-checked. Combining this with a complete
    1,152,000-pair repeat-plane certificate classifies every critical
    six-plane. The sharp max_i |v_i| < 3q bound holds on every such plane,
    with unbounded parameters, signs and permutations, and for all positive
    primitive near-tight sextuples above the explicit global norm cutoff.
    The remaining finite region is unverified, so the sharp unrestricted
    six-speed Question 6.6 and completeness of the sporadic list are not
    asserted. Other selected results include a global norm-36 integer
    relation, exact maximizing-time and denominator theorems, primitive
    boundary families, and the nine exact sporadic values in Cordella's
    Table 2. Conditional prime-capacity lemmas remain supporting code.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11K60, 11J13, 11Y16]
sources:
  - title: Odd denominators in the Lonely Runner spectrum for six speeds
    authors: [Francesco Cordella]
    type: paper
    url: https://arxiv.org/abs/2609.03444v2
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Formalizes the nine exact values in Table 2 and adapts the candidate-time
      principle of Lemma 2.2 using sum denominators and opposing active
      runners. The denominator, boundary-family, critical-family and prime-obstruction
      arguments are presented in PROOF.md and the Lean sources. No claim
      of literature priority is made for these extensions. Questions 6.6
      and 6.7 motivate the application. The effective global off-critical bound
      is proved under the reduction lemma's explicit lower-speed hypotheses;
      the sharp unrestricted six-speed Question 6.6 is not asserted.
  - title: The structure of Lonely Runner spectra
    authors: [Vikram Giri, Noah Kravitz]
    type: paper
    url: https://arxiv.org/abs/2304.01462v4
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Lemma 3.3 is the source of the lower-speed rank reductions.
      The required rank-two and rank-three lower bounds are proved directly
      here from explicit lower-speed Lonely Runner hypotheses.
  - title: "View-obstruction: a shorter proof for 6 lonely runners"
    authors: [Jérôme Renault]
    type: paper
    url: https://doi.org/10.1016/j.disc.2004.06.008
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Source of the constrained-maximum proof through five speeds. The
      formalization supplies exact closed-cell certificates in place of
      the published five-speed residue casework.
  - title: Six Lonely Runners
    authors: [Tom Bohman, Ron Holzman, Daniel Kleitman]
    type: paper
    url: https://www.combinatorics.org/ojs/index.php/eljc/article/download/v8i2r3/pdf
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Theorem 3 gives the known two-profile tight-five classification.
      This development proves the classification by a geometric norm
      bound and finite modular moment identities, rather than importing
      the published theorem as an axiom. No priority claim is made.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI Codex (GPT-6), directed by JD Jones
      notes: >-
        Assisted with mathematical arguments; wrote Lean proofs and
        documentation; generated rational interval certificates and a
        complete short-form catalogue with Python; compiled and audited
        all included proof terms. Generated data and external computations
        are not trusted without Lean proofs.
    - method: copilot
      tool_setup: OpenAI GPT-6 Pro
      notes: >-
        Supplied an automated mathematical assessment and proposed
        denominator, boundary-family and prime-threshold extensions. A separate
        mathematical consultation supplied the projection-height mechanism
        reconstructed in the research notes and formalized here with coarse constants.
        The assessment did not include a Lean rebuild. Included extensions
        were subsequently checked and formalized by Codex.
review:
  status: agent-reviewed
  notes: >-
    GPT-6 Pro assessed the existing statements and proofs without rebuilding
    Lean. Codex checked and formalized the included extensions, rebuilt the
    package, and ran source and axiom audits. The verification workflow runs
    sandboxed Comparator and independent NanoDa and con-ron checks on all
    selected claims. No independent human review is recorded. Palomar's automated
    editorial review declined the earlier 7fa5a11 submission for insufficient
    demonstrated research interest of its conditional prime-obstruction group.
    The present revision has not been resubmitted or editorially approved.
scope:
  completed: The 67 theorems listed in comparator.json and their supporting development.
  excluded: >-
    Sharp unrestricted six-speed Question 6.6; a sharp enough six-speed norm
    cutoff and exhaustive off-critical certificates; the sharp denominator-height
    constant; completeness of the sporadic list; complete critical-family
    spectrum; classification of all maximizing times for the boundary family.
