version: v0.4
project:
  name: Critical-Family Bounds and Exact Maxima for Lonely Runners
  description: >-
    Proves max_i |v_i| < 3q on all three explicit critical families, with
    primitive nonzero speeds, arbitrary signs and coordinate permutations,
    unbounded parameters, and actual real-time loneliness a/q < 1/6. The
    third-family proof uses six good points and eighteen rays with exact
    residue arithmetic; it assumes no spectral classification. A proved
    good-triangle checker also certifies an unbounded noncritical family.
    Every integer sextuple with loneliness at most 1/6 has a nonzero integer
    annihilator with squared norm at most 36, proved by expanding and
    integrating an explicit Fourier obstruction. This global necessary
    condition has no speed cutoff or modular-cover hypothesis.
    For every rank-two integer plane, proves attainment and rationality of its
    actual loneliness, with reduced denominator at most three times the
    displayed basis area H, and proves the orbit density inequality.
    Consequently L(v) < 1/n < L(U) implies norm(v) < (3n/2) H^2.
    A proved Bezout change of basis makes this a uniform finite reduction
    for all coprime parameter directions in any fixed noncritical plane.
    The uniform height construction remains outstanding. The unrestricted
    Questions 6.6 and 6.7 remain targets, not proved theorems.
    Every maximizing time for positive integer speeds is rational. The
    reduced loneliness denominator divides an opposing active-pair sum
    after dividing by the pair's gcd. At a maximizing time of reduced
    denominator r, every active speed v_i satisfies q = r/gcd(r,v_i).
    For distinct positive speeds with maximum M the bound q <= 2M-1 is
    sharp, attained by every consecutive pair. For every n >= 3, the
    primitive family (1,d,2d,...,(n-1)d), d = n^(e+1), has loneliness 1/n,
    unbounded largest speed and explicit maximizing times with unbounded
    ratios of time denominator to value denominator. The development also
    proves exact finite-grid optimization, all nine sporadic values in
    Cordella's Table 2, and a general finite-prime obstruction to six
    distinct positive speeds being free of additive triads. The numerical
    obstruction uses 233 distinct primes at least 139, under explicit norm
    and modular covering hypotheses. Scaling invariance, plane geometry and
    supporting effective-bound arithmetic are included. The global resolutions of
    Questions 6.6 and 6.7 and completeness of the sporadic list are outside
    the submitted scope.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11K60, 11J13, 11Y16]
sources:
  - title: Odd denominators in the Lonely Runner spectrum for six speeds
    authors: [Francesco Cordella]
    type: paper
    url: https://arxiv.org/abs/2609.03444v2
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Formalizes the nine exact values in Table 2 and adapts the candidate-time
      principle of Lemma 2.2 using sum denominators and opposing active
      runners. The denominator, boundary-family, critical-family and prime-obstruction
      arguments are presented in PROOF.md and the Lean sources. No claim
      of literature priority is made for these extensions. Questions 6.6
      and 6.7 motivate the application; their global resolutions are not
      asserted by this submission.
automation:
  methods:
    - method: agent
      tool_setup: OpenAI Codex (GPT-6), directed by JD Jones
      notes: >-
        Assisted with mathematical arguments; wrote Lean proofs and
        documentation; generated rational interval certificates and a
        complete short-form catalogue with Python; compiled and audited
        all included proof terms. Generated data and external computations
        are not trusted without Lean proofs.
    - method: copilot
      tool_setup: OpenAI GPT-6 Pro
      notes: >-
        Supplied an automated mathematical assessment and proposed
        denominator, boundary-family and prime-threshold extensions. A separate
        mathematical consultation supplied the projection-height mechanism
        reconstructed in the research notes and partially formalized here.
        The assessment did not include a Lean rebuild. Included extensions
        were subsequently checked and formalized by Codex.
review:
  status: agent-reviewed
  notes: >-
    GPT-6 Pro assessed the existing statements and proofs without rebuilding
    Lean. Codex checked and formalized the included extensions, rebuilt the
    package, and ran source and axiom audits. The verification workflow runs
    sandboxed Comparator and independent NanoDa and con-ron checks on all
    selected claims. No independent human review is recorded. Palomar's automated
    editorial review declined the earlier 7fa5a11 submission for insufficient
    demonstrated research interest of its conditional prime-obstruction group.
    The present revision has not been resubmitted or editorially approved.
scope:
  completed: The 58 theorems listed in comparator.json and their supporting development.
  excluded: >-
    Global resolutions of Questions 6.6 and 6.7; construction of a uniformly
    bounded-height containing plane; the sharp denominator-height constant;
    completeness of the sporadic list; critical-torus classification;
    unconditional finite-field prime assertions; complete critical-family spectrum; classification of all
    maximizing times for the boundary family.
