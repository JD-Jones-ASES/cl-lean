name: Lean verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          leanchecker: 'false'
      - run: python3 -O scripts/check_sources.py
      - run: python3 scripts/generate_repeat_lean.py --check
      - run: python3 scripts/generate_five_speed_lean.py --check
      - run: lake env lean AxiomAudit.lean
      - name: Install Comparator sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - run: python3 scripts/verify_exports.py
